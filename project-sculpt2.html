<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details | Lizardman Sculpt</title>

    <link rel="stylesheet" href="Stylesheet.css">
</head>

<body>

    <nav class="glass-nav">
        <div class="container"
            style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem;">
            <a href="index.html" style="display: flex; align-items: center;">
                <img src="other-assets/logo-for-A3V2-ALT.png" alt="Camden Bohanan Logo"
                    style="height: 100px; width: auto; max-height: 120px;">
            </a>
            <div style="display: flex; gap: 2rem;">
                <a href="index.html" style="font-size: 1.3rem; font-weight: 600;">Work</a>
                <a href="About_me.html" style="font-size: 1.3rem; font-weight: 600;">About</a>
                <a href="contact.html" style="font-size: 1.3rem; font-weight: 600;">Contact</a>
            </div>
        </div>
    </nav>

    <div class="project-carousel reveal active">


        <div class="carousel-item">
            <img src="renders/Bohanan_Camden_DFX/DFX-499/Sculpt3/Tabard-1.jpg" alt="Front View">
        </div>


        <div class="carousel-item">
            <img src="renders/Bohanan_Camden_DFX/DFX-499/Sculpt3/Cloak-1.jpg" alt="Side View">
        </div>


        <div class="carousel-item">
            <img src="renders/Bohanan_Camden_DFX/DFX-499/Sculpt3/Tabard-2.jpg" alt="Wireframe Detail">
        </div>

        <div class="carousel-item">
            <img src="renders/Bohanan_Camden_DFX/DFX-499/Sculpt3/Cloak-2.jpg" alt="Wireframe Detail">
        </div>

        <div class="carousel-item">
            <img src="renders/Bohanan_Camden_DFX/DFX-499/Sculpt3/Tabard-3.jpg" alt="Wireframe Detail">
        </div>

        <div class="carousel-item">
            <img src="renders/Bohanan_Camden_DFX/DFX-499/Sculpt3/Cloak-3.jpg" alt="Wireframe Detail">
        </div>

    </div>

    <!-- Visual Hint for User -->
    <div
        style="display: flex; justify-content: center; gap: 10px; margin-top: 1rem; color: var(--text-muted); font-size: 0.8rem;">
        <h2>&larr; Swipe to flip &rarr;</h2>
    </div>


    <footer class="container" style="text-align: center; padding: 6rem 0;">
        <p style="color: var(--text-muted); margin-bottom: 2rem;">© 2026 Camden Bohanan</p>
    </footer>


    <script>
        const observerOptions = { threshold: 0.1 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>

</html>
