<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Camden Bohanan</title>
    <link rel="stylesheet" href="Stylesheet.css">

</head>

<body>
    <!-- 1. Navigation -->
    <nav class="glass-nav">
        <div class="container"
            style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem;">
            <a href="index.html" style="display: flex; align-items: center;">
                <img src="other-assets/logo-for-A3V2-ALT.png" alt="Camden Bohanan Logo"
                    style="height: 100px; width: auto; max-height: 120px;">
            </a>
            <div style="display: flex; gap: 2rem;">
                <a href="index.html" style="font-size: 1.3rem; font-weight: 600;">Work</a>
                <a href="About_me.html" style="font-size: 1.3rem; font-weight: 600;">About</a>
                <a href="contact.html" style="font-size: 1.3rem; font-weight: 600;">Contact</a>
            </div>
        </div>
    </nav>

    <!-- 2. Main Content -->
    <main class="container" style="padding-top: 8rem;">
        <h1 style="font-size: 4rem; margin-bottom: 1rem;">Get in Touch</h1>
        <p class="project-description" style="max-width: 600px; font-size: 1.2rem;">
            For commissions, studio inquiries, or technical consultations regarding 3D print design and digital
            sculpting.
        </p>

        <div class="social-container">
            <!-- ArtStation -->
            <div class="social-row">
                <div class="social-icon-wrapper">
                    <!-- Drop your ArtStation icon path here -->
                    <img src="other-assets/icons8-artstation-480-inverted.png" alt="">
                </div>
                <span class="social-label">ArtStation</span>

                <a href="https://www.artstation.com/camdenbohanan" target="_blank" class="social-link">

                </a>
            </div>

            <!-- LinkedIn -->

            <div class="social-row">
                <div class="social-icon-wrapper">
                    <!-- Drop your LinkedIn icon path here -->
                    <img src="other-assets/linkedin-inverted.png" alt="">
                </div>
                <span class="social-label">LinkedIn</span>

                <a href="https://www.linkedin.com/in/camden-bohanan/" target="_blank" class="social-link">
                    Connect <span class="arrow-icon"></span>
                </a>
            </div>

            <!-- Email -->
            <div class="social-row">
                <div class="social-icon-wrapper">
                    <!-- Drop your Email/Mail icon path here -->
                    <img src="other-assets/mail-inverted.png" alt="">
                </div>
                <span class="social-label">Email</span>
                <a href="mailto:bohananco@gmail.com" class="social-link">
                    Message <span class="arrow-icon"></span>
                </a>
            </div>
        </div>

    <footer class="container"
        style="text-align: center; padding: 6rem 0; margin-top: 4rem; border-top: 1px solid var(--border-color);">
